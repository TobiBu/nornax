name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      JAX_ENABLE_X64: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Black
        run: black --check .

      - name: isort
        run: isort --check-only .

      - name: pydoclint (full package)
        run: pydoclint nornax/

      - name: Unit tests with coverage
        run: pytest

      - name: Runtime type-check smoke (jaxtyping + beartype)
        env:
          NORNAX_RUNTIME_TYPECHECK: "1"
        run: >-
          pytest -o addopts="" --no-header -q
          tests/integration/test_two_body.py
          tests/unit/test_direct_gravity.py
          tests/unit/test_jaccpot_adapter.py

      - name: Upload coverage XML artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-py${{ matrix.python-version }}
          path: coverage.xml
