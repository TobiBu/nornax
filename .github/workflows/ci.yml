name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      JAX_ENABLE_X64: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Black
        run: black --check .

      - name: isort
        run: isort --check-only .

      - name: pydoclint (full package)
        run: pydoclint nornax/

      - name: Unit tests with coverage
        run: pytest

      - name: Runtime type-check smoke (jaxtyping + beartype)
        env:
          NORNAX_RUNTIME_TYPECHECK: "1"
        run: >-
          pytest -o addopts="" --no-header -q
          tests/integration/test_two_body.py
          tests/unit/test_direct_gravity.py
          tests/unit/test_jaccpot_adapter.py
          tests/unit/test_potentials.py

      - name: Upload coverage XML artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-py${{ matrix.python-version }}
          path: coverage.xml

  # The jaccpot-backed tests (mimirax's solver-tests pattern). The job above installs
  # no jaccpot, so every test that imports it is skipped there; this one installs
  # jaccpot and yggdrax from GitHub at PINNED commits and runs those tests on CPU in
  # float64 (the fused-lane files run their Pallas kernels in interpret mode).
  #
  # PINS: jaccpot main a2add480 (2026-11-27, #531's merge: the carried restore keeps the
  # writer's tree and static target-block preflight, which HH5's restore path
  # (install_recorded_tree) uses; it has #532's opt-in LET exchange, #529's mesh form of
  # the carried scheme, MortonPartition and FusedMeshForce targets=, #527's donated
  # segments and host-copy retry, #525's grouped back-reaction SourceGroups, point_mask
  # and TargetSources live rows, and #524's carried-scheme seam) and yggdrax main 24de6c3
  # (#132; jaccpot's CI and the HoreKa bundle install yggdrax main). Bump them together:
  # jaccpot's `yggdrax>=0.0.1` and jax window (>=0.11.2,<0.12) are what the resolver
  # reconciles.
  solver-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JAX_ENABLE_X64: "1"
      JAX_PLATFORMS: cpu
      YGGDRAX_REF: 24de6c334613d4d65c673b09f40c9a1d0ea2f378
      JACCPOT_REF: a2add4808cc16878a5e284523565350038d0de93

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # jaccpot requires Python >= 3.12.
          python-version: "3.12"
          cache: pip

      - name: Install nornax + jaccpot and yggdrax at the pinned commits
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" \
            "yggdrax @ git+https://github.com/TobiBu/yggdrax.git@${YGGDRAX_REF}" \
            "jaccpot @ git+https://github.com/TobiBu/jaccpot.git@${JACCPOT_REF}"
          python -c "import jax, jaccpot, yggdrax; print('jax', jax.__version__)"

      - name: The jaccpot-backed tests (CPU)
        run: >-
          pytest -o addopts="" --no-header -q
          tests/unit/test_segments.py
          tests/unit/test_leapfrog_hooks.py
          tests/unit/test_jaccpot_adapter.py
          tests/integration/test_jaccpot_adapter_smoke.py
          tests/integration/test_fused_boundary_rollout.py
          tests/integration/test_jaccpot_provider_gradients.py
          tests/integration/test_jaccpot_provider_shooting.py
          tests/integration/test_jaccpot_provider_rollout.py
          tests/integration/test_jaccpot_sharded.py

  # The hybrid Hermite tests (sessions 1-2) in a job of their own: with them the
  # solver-tests job above would run ~80 of its 90 minutes (2026-11-15; split, not raised).
  solver-tests-hybrid:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JAX_ENABLE_X64: "1"
      JAX_PLATFORMS: cpu
      YGGDRAX_REF: 24de6c334613d4d65c673b09f40c9a1d0ea2f378
      JACCPOT_REF: a2add4808cc16878a5e284523565350038d0de93

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # jaccpot requires Python >= 3.12.
          python-version: "3.12"
          cache: pip

      - name: Install nornax + jaccpot and yggdrax at the pinned commits
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" \
            "yggdrax @ git+https://github.com/TobiBu/yggdrax.git@${YGGDRAX_REF}" \
            "jaccpot @ git+https://github.com/TobiBu/jaccpot.git@${JACCPOT_REF}"
          python -c "import jax, jaccpot, yggdrax; print('jax', jax.__version__)"

      - name: The hybrid Hermite tests on jaccpot (CPU)
        run: >-
          pytest -o addopts="" --no-header -q
          tests/integration/test_jaccpot_hybrid.py
          tests/integration/test_jaccpot_clusters.py

  # The clusters inside jaccpot's ProductionRunner (HH3b, 2026-11-21): the runner
  # against run_segments, restarts in a fresh runner, escapers + stripping. A job of
  # its own (each case compiles the fused lane's clusters programs: ~15-20 min on a
  # loaded 64-core host). The tests skip until JACCPOT_REF has jaccpot.carried.
  solver-tests-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JAX_ENABLE_X64: "1"
      JAX_PLATFORMS: cpu
      YGGDRAX_REF: 24de6c334613d4d65c673b09f40c9a1d0ea2f378
      JACCPOT_REF: a2add4808cc16878a5e284523565350038d0de93

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # jaccpot requires Python >= 3.12.
          python-version: "3.12"
          cache: pip

      - name: Install nornax + jaccpot and yggdrax at the pinned commits
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" \
            "yggdrax @ git+https://github.com/TobiBu/yggdrax.git@${YGGDRAX_REF}" \
            "jaccpot @ git+https://github.com/TobiBu/jaccpot.git@${JACCPOT_REF}"
          python -c "import jax, jaccpot, yggdrax; print('jax', jax.__version__)"

      - name: The clusters in jaccpot's ProductionRunner (CPU)
        run: >-
          pytest -o addopts="" --no-header -q
          tests/integration/test_jaccpot_runner.py

  # The clusters on jaccpot's mesh (HH4c, 2026-11-24): a one-device mesh against the
  # single-card runner (bitwise here, a few ulp across programs) and two forced CPU
  # devices (a subprocess) against one card. A job of its own: each case compiles the
  # fused lane's clusters programs, the two-device one the mesh lane's too. The tests
  # skip until JACCPOT_REF has jaccpot.distributed.clusters_mesh.
  solver-tests-mesh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JAX_ENABLE_X64: "1"
      JAX_PLATFORMS: cpu
      YGGDRAX_REF: 24de6c334613d4d65c673b09f40c9a1d0ea2f378
      JACCPOT_REF: a2add4808cc16878a5e284523565350038d0de93

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # jaccpot requires Python >= 3.12.
          python-version: "3.12"
          cache: pip

      - name: Install nornax + jaccpot and yggdrax at the pinned commits
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" \
            "yggdrax @ git+https://github.com/TobiBu/yggdrax.git@${YGGDRAX_REF}" \
            "jaccpot @ git+https://github.com/TobiBu/jaccpot.git@${JACCPOT_REF}"
          python -c "import jax, jaccpot, yggdrax; print('jax', jax.__version__)"

      - name: The clusters on jaccpot's mesh (CPU)
        run: >-
          pytest -o addopts="" --no-header -q
          tests/integration/test_jaccpot_mesh.py
